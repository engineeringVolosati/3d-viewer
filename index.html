<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
  #viewer { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="viewer"></div>
<script type="text/javascript" src="https://3dviewer.net/build/three_based/o3dv.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const modelUrl = params.get('model') || 'model.step';
  OV.Init3DViewerElement(document.getElementById('viewer'), [modelUrl], {
    camera: {
      eye: { x: 2, y: 2, z: 2 },
      center: { x: 0, y: 0, z: 0 },
      up: { x: 0, y: 1, z: 0 }
    }
  });
</script>
</body>
</html>
