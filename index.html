<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
  #viewer { width: 100%; height: 100%; }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #aaa; font-family: sans-serif; font-size: 14px; text-align: center;
  }
</style>
</head>
<body>
<div id="loading">Loading model…</div>
<div id="viewer"></div>
<script type="text/javascript" src="https://3dviewer.net/build/three_based/o3dv.min.js"></script>
<script>
  const DEFAULT_MODEL = 'https://github.com/engineeringVolosati/3d-viewer/releases/download/v1.0/model.step';
  const params = new URLSearchParams(window.location.search);
  const modelUrl = params.get('model') || DEFAULT_MODEL;

  document.getElementById('loading').style.display = 'block';

  OV.Init3DViewerElement(document.getElementById('viewer'), [modelUrl], {
    camera: {
      eye: { x: 2, y: 2, z: 2 },
      center: { x: 0, y: 0, z: 0 },
      up: { x: 0, y: 1, z: 0 }
    },
    onModelLoaded: function() {
      document.getElementById('loading').style.display = 'none';
    }
  });
</script>
</body>
</html>
