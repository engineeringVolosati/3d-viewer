<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #666; font-family: sans-serif; font-size: 12px; pointer-events: none;
  }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #aaa; font-family: sans-serif; font-size: 14px;
  }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<div id="info">drag to rotate · scroll to zoom · right-click to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MODEL_URL = 'https://github.com/engineeringVolosati/3d-viewer/releases/download/v1.0/model.glb';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5, 10, 7);
scene.add(dir);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 10000);
camera.position.set(1, 1, 2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const loader = new GLTFLoader();
loader.load(MODEL_URL, (gltf) => {
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  gltf.scene.position.sub(center);
  camera.position.set(0, 0, size * 1.5);
  controls.target.set(0, 0, 0);
  controls.update();
  scene.add(gltf.scene);
  document.getElementById('loading').style.display = 'none';
}, (xhr) => {
  const pct = Math.round(xhr.loaded / xhr.total * 100);
  document.getElementById('loading').textContent = `Loading… ${pct}%`;
}, (err) => {
  document.getElementById('loading').textContent = 'Error loading model';
  console.error(err);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
